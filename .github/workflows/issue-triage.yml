# Assign every newly opened issue to the org maintainers (org variable ISSUE_TRIAGE_ASSIGNEES).
name: issue-triage
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  triage:
    uses: vagarylabs/.github/.github/workflows/issue-triage.yml@76604b1ea360a742091777f25179cda04e6956eb # main
    with:
      assignees: ${{ vars.ISSUE_TRIAGE_ASSIGNEES }}
